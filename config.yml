server:
  port: 8080
  host: "localhost"

database:
  path: "backmeup.db"

upload:
  chunk_size_mb: 100
  temp_dir: ""  # Empty means same level as source directory

retry_policy:
  max_attempts: 3
  initial_backoff_seconds: 2
  max_backoff_seconds: 60
  backoff_multiplier: 2

rate_limits:
  mega:
    requests_per_second: 10
    bandwidth_mb_per_second: 5
  fourshared:
    requests_per_second: 5
    bandwidth_mb_per_second: 3

concurrency:
  max_concurrent_uploads: 2
  max_concurrent_per_account: 1
  max_workers: 5

quota:
  sync_interval_minutes: 60
  cache_in_db: true

verification:
  enabled: true
  verify_on_upload: true
  periodic_check_days: 30

ui:
  # How often the browser re-fetches the table, in seconds. active_poll_seconds
  # is used only while an upload is pending or in progress, so progress bars stay
  # smooth without polling hard when nothing is happening. It is clamped to at
  # most poll_seconds.
  poll_seconds: 10
  active_poll_seconds: 2

scan:
  # How many directory levels below the source root are recorded in a zip's
  # tree. 3 records the root plus three levels beneath it. Directory names to
  # leave out of the tree are managed in the app's Settings modal, not here.
  max_depth: 3

reauth:
  # The in-app "Re-authorize" button runs the provider's OAuth flow and needs a
  # local listener for the callback. callback_port must match the port in the
  # callback URL the provider's registered application accepts — 4shared rejects
  # localhost as an application domain, so the domain in .env
  # (FOURSHARED_ACCOUNT_<n>_CONSUMER_DOMAIN) must resolve to 127.0.0.1. This
  # matches cmd/fourshared-auth's default, so an app registered for that tool
  # works here unchanged.
  callback_port: 8723
  # How long to wait for you to approve access in the browser before giving up
  # and releasing the port.
  timeout_minutes: 5
